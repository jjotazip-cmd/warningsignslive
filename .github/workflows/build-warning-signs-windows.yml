name: Build Warning Signs for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop-app/**'
      - '.github/workflows/build-warning-signs-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and compile native audio module
        run: npm install
      - name: Build Windows installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: warning-signs-windows-installer
          path: desktop-app/dist/*.exe
          if-no-files-found: error
