<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escolher compartilhamento</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#111;color:#f5f5f5;font:15px/1.4 system-ui,Segoe UI,sans-serif}h1{font-size:20px;margin:0 0 6px}p{margin:0 0 18px;color:#aaa}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.source{background:#1c1c1c;color:#fff;border:1px solid #393939;border-radius:10px;padding:8px;text-align:left;cursor:pointer}.source:hover,.source:focus{border-color:#fff;outline:2px solid #fff}.source img{width:100%;height:118px;object-fit:cover;background:#000;border-radius:6px}.source span{display:block;padding:8px 2px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bottom{display:flex;justify-content:flex-end;margin-top:16px}.bottom button{background:transparent;color:#fff;border:1px solid #555;border-radius:8px;padding:9px 14px;cursor:pointer}
</style>
</head>
<body>
<h1>O que você quer compartilhar?</h1>
<p>Escolha uma tela inteira ou uma janela.</p>
<div class="grid" id="sources"></div>
<div class="bottom"><button type="button" onclick="screenPicker.cancel()">Cancelar</button></div>
<script>
screenPicker.onSources(sources=>{
 const grid=document.getElementById('sources');
 for(const source of sources){
  const button=document.createElement('button');button.className='source';button.type='button';
  const image=document.createElement('img');image.src=source.thumbnail;image.alt='';
  const name=document.createElement('span');name.textContent=source.name;
  button.append(image,name);button.onclick=()=>screenPicker.choose(source.id);grid.append(button);
 }
});
</script>
</body>
</html>
